name: Compare free runner access to recruitment sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Probe public recruitment pages
        shell: pwsh
        run: |
          $urls = @(
            'https://www.esic.gov.in/recruitments',
            'https://esic.gov.in/recruitments',
            'https://www.nabard.org/careers-notices1.aspx',
            'https://nr.indianrailways.gov.in/',
            'https://careers.bhel.in/index.jsp',
            'https://cfw.ap.nic.in/',
            'https://dme.ap.nic.in/'
          )
          foreach ($url in $urls) {
            $sink = Join-Path $env:RUNNER_TEMP 'probe-response'
            $line = & curl.exe -L -sS -A 'MBBSJobsTracker/0.1' --connect-timeout 8 --max-time 18 -o $sink -w 'status=%{http_code} final=%{url_effective} bytes=%{size_download}' $url 2>&1
            Write-Output "$url $line"
          }
