name: Diagnostic public source connectivity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public source user agents
        shell: bash
        run: |
          for url in 'https://www.trinayanhospital.com/vc.html' 'https://careers.bhel.in/index.jsp' 'https://iocl.com/latest-job-opening'; do
            for ua in 'MBBSJobsTracker/0.1' 'Mozilla/5.0' 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36 MBBSJobsTracker/0.1'; do
              printf '%s agent=%s ' "$url" "$ua"
              curl -L -sS --max-time 12 -A "$ua" -o /dev/null -w 'status=%{http_code} final=%{url_effective}\n' "$url" || true
            done
          done
