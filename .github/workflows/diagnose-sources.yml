name: Diagnose registered Odisha sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Public source DNS and HTTPS diagnostics
        run: |
          node --input-type=module <<'JS'
          import dns from 'node:dns/promises';
          import https from 'node:https';
          const urls=['https://khordha.odisha.gov.in/en/notice/recruitment','https://anugola.odisha.gov.in/en/notice/recruitment','https://utkalhospital.com/career/','https://www.utkalhospital.com/career/'];
          for(const url of urls){const host=new URL(url).hostname;for(const method of ['lookup','resolve4']){try{console.log(JSON.stringify({host,method,answer:await dns[method](host)}));}catch(e){console.log(JSON.stringify({host,method,error:e.message,code:e.code}));}}}
          const variants=urls.flatMap(url=>[{url,mode:'tls12',maxVersion:'TLSv1.2'},{url,mode:'full-headers'}]);
          await Promise.all(variants.map(({url,mode,maxVersion})=>new Promise(resolve=>{const start=Date.now();const req=https.get(url,{family:4,maxVersion,headers:mode==='full-headers'?{'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36 MBBSJobsTracker/0.1',Accept:'text/html,application/xhtml+xml','Accept-Language':'en-IN,en;q=0.9','Accept-Encoding':'identity'}:{'User-Agent':'Mozilla/5.0',Accept:'text/html'},signal:AbortSignal.timeout(20000)},res=>{let size=0;res.on('data',b=>size+=b.length);res.on('end',()=>{console.log(JSON.stringify({url,mode,status:res.statusCode,bytes:size,ms:Date.now()-start}));resolve();});});req.on('error',e=>{console.log(JSON.stringify({url,mode,error:e.message,code:e.code,ms:Date.now()-start}));resolve();});})));
          for(const host of ['khordha.odisha.gov.in','utkalhospital.com']){try{const r=await fetch('https://cloudflare-dns.com/dns-query?name='+host+'&type=A',{headers:{accept:'application/dns-json'},signal:AbortSignal.timeout(15000)});console.log(JSON.stringify({host,resolver:'DoH',status:r.status,answer:await r.json()}));}catch(e){console.log(JSON.stringify({host,resolver:'DoH',error:e.message}));}}
          JS
